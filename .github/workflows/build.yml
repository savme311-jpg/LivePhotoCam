name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - run: |
          if [ -f LivePhotoCam.zip ]; then unzip -q -o LivePhotoCam.zip; cd LivePhotoCam; fi
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/LivePhotoCam.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LivePhotoCam-apk
          path: out/LivePhotoCam.apk
